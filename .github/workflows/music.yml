name: Música (Mixkit)
on:
  push:
    branches: [main]
    paths: ["music/fuentes.txt", "pipeline/music_fetch.py"]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python pipeline/music_fetch.py
      - name: Guardar temas
        run: |
          git config user.name "antesdelos90-bot"; git config user.email "actions@users.noreply.github.com"
          git add music/mixkit && git commit -m "Música: temas nuevos de Mixkit" || echo "sin cambios"
          git pull --rebase && git push
