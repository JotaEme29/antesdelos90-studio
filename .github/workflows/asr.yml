name: asr-tmp
on: { push: { branches: [asr-tmp] } }
jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - run: pip install -q faster-whisper && python tmp_asr/asr_q.py tmp_asr/a.m4a
