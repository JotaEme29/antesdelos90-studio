name: tts-tmp
on: { push: { branches: [tts-tmp] } }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/.local/share/tts, key: xtts-v2 }
      - run: pip install -q "coqui-tts" soundfile && python tmp_tts/tts.py
      - uses: actions/upload-artifact@v4
        with: { name: voz, path: out/voz_clonada.wav }
