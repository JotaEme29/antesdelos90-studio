name: Publicar en YouTube
on:
  push:
    branches: [main]
    paths: ["queue/**"]   # también cuando Miguel sube su grabación (queue/<vídeo>/voz.m4a)
  schedule:
    - cron: "17 6 * * *"        # cada día 06:17 UTC: sube lo que se publica en las próximas 30 h
    - cron: "17 16 * * *"       # y a las 16:17 UTC, por si algo falló por la mañana
  workflow_dispatch: {}
concurrency: { group: youtube, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      - name: Validar cola
        run: python pipeline/validate.py
      - name: Renderizar y subir lo aprobado
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/publish.py
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "antesdelos90-bot"; git config user.email "actions@users.noreply.github.com"
          git add queue && git commit -m "Estado de publicación actualizado" || echo "sin cambios"
          git pull --rebase && git push
